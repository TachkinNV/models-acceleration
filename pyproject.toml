[tool.poetry]
name = "model-acceleration"
version = "0.1.0"
description = "Бенчмарки и ускорение инференса нейросетей (PyTorch, ONNX Runtime, TensorRT) на Tesla V100"
authors = ["tachkin <tachkin@users.noreply.github.com>"]
readme = "README.md"
packages = [{ include = "model_acceleration", from = "src" }]

[tool.poetry.dependencies]
python = "^3.10"
numpy = "^1.24"
onnx = "^1.15"
torch = { version = ">=2.0.0", source = "pytorch" }
torchvision = { version = ">=0.15.0", source = "pytorch" }

[tool.poetry.group.onnx]
optional = true

[tool.poetry.group.onnx.dependencies]
onnxruntime-gpu = ">=1.18"

[tool.poetry.group.tensorrt]
optional = true

[tool.poetry.group.tensorrt.dependencies]
# TensorRT 8.5.1.7 — последняя проверенная версия с поддержкой Volta (SM 7.0).
# TensorRT 10.x на V100 не работает (Unsupported SM: 0x700).
tensorrt = "8.5.1.7"
pycuda = "2022.2.2"

[tool.poetry.scripts]
model-acceleration = "model_acceleration.__main__:main"
model-acceleration-train = "model_acceleration.train:main"

[[tool.poetry.source]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu118"
priority = "explicit"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
